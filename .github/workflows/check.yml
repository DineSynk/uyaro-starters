name: check
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *' # daily, so a starter that stops working is noticed without a commit
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: node check.mjs
